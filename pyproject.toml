[project]
name = "lakehouse"
version = "0.1.0"
description = "Iceberg table layouts measured: files and bytes a fixed workload must read under partitioning, sorting, small appends and compaction, with a Delta Lake comparison."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deltalake==1.6.6",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "pyiceberg-core==0.10.1",
    "pyiceberg[pyarrow,pyiceberg-core,sql-sqlite]==0.12.0",
    "sqlalchemy==2.1.4",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
lakehouse = "lakehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not minio'"
markers = [
    "minio: needs the MinIO service from docker-compose.yml (deselected by default)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
